         <div id="stats_container">

                <img src="item_pngs/white_herb.png" id="white_herb">
                <img src="item_pngs/flame_orb.png" id="flame_orb">

                <div class="abilities_images2">
                    <div class="ability_tag_outer">

                    <img src="global_link/global_link_darmanitan_galar_zen.png" id="darmanitan_galar">

                <div class="abilities_images2">

        <div id="tera_container" class="battle_section">
            <div id="tera_description">Explain tera type</div>
            <div id="tera_image">
                <img src="tera_koraidon.png" id="tera_koraidon">
                <img src="tera_miraidon.png" id="tera_miraidon">
