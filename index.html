<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        body {
            margin: 0;
        }
        #container{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            width: 100vw;
            height: 120px;
            background-color: blue;
        }
        #page_one {
            /* setting image as background */
            background-image: url(sbrv1.jpg);
        }
        #page_two {
            /* setting image as background */
            background-image: url(porygon2.jpg);
        }
        #page_three {
            /* setting image as background */
            background-image: url(geris_game.png);
        }
        .nav_item {
            background-repeat: no-repeat;
            background-size: cover;
            width: 100px;
            height: 100px;
            margin: 10px;
            text-align: center;
            font-size: 1rem;
        }
        .nav_item:hover {
            width: 200px;
            height: 200px;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="nav_item" id="page_one">
            page 1
        </div>
        <div class="nav_item" id="page_two">
            page 2
        </div>
        <div class="nav_item" id="page_three">
            page 3
        </div>
    </div>
</body>
</html>
