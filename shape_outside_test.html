<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: blue;
        }
        .container {
            width: 500px;
            font-family: sans-serif;
            line-height: 1.6;
        }
        .shape {
            float: left;
            width: 200px;
            min-height: 200px;

            background-image: url(pokemon_pngs/xurkitree.png);
            background-size: cover;
            background-repeat: no-repeat;

            clip-path: url(pokemon_pngs/xurkitree.png);
            shape-image-threshold: 0.5;
            shape-margin: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="shape"></div>
        <p>
            Your long paragraph of text goes here. As it flows down the container, 
            each line will curve cleanly around the circular boundary of the floated 
            div instead of stopping at a sharp rectangular edge.
        </p>
    </div>
</body>
</html>
