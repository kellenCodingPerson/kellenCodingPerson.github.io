<head>
    <meta charset="UTF-8">

    <title>Stats</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <!-- navbar -->
    <div id="navbar">
        <!-- link to homepage -->
        <a href="index.html">
            <div class="nav_item" id="page_one">
                Home
            </div>
        </a>

        <!-- link to species page -->
        <a href="Species.html">

        <!-- link to stats page -->

        <!-- link to forms page -->

            <div class="nav_item" id="page_four">

         <a href="Customize.html">

    <!-- title -->
    <div id="stats_title_container">
        <div id="stats_title">

        </div>
    </div>
    <div id="stats_container">

        <!-- evs and ivs -->
        <div class="stats_description">Explain EVs and IVs here</div>
        <div class="stats_image">
            <img src="floette_stats.jpg" id="floette_stats">
            <img src="ev_iv.png" id="ev_iv">
        </div>

        <!-- items -->
        <div class="stats_image">
            <img class="item_image" src="choice_specs.png" id="choice_specs">
            <img class="item_image" src="choice_scarf.png" id="choice_scarf">
            <img class="item_image" src="choice_band.png" id="choice_band">
            <img class="item_image" src="safety_goggles.png" id="safety_goggles">
            <img class="item_image" src="sitrus_berry.png" id="sitrus_berry">
            <img class="item_image" src="smooth_rock.png" id="smooth_rock">

            <img class="item_image" src="icy_rock.png" id="icy_rock">
            <img class="item_image" src="heat_rock.png" id="heat_rock">
            <img class="item_image" src="light_clay.png" id="light_clay">
            <img class="item_image" src="eviolite.png" id="eviolite">
            <img class="item_image" src="focus_sash.png" id="focus_sash">
            <img class="item_image" src="assault_vest.png" id="assault_vest">
        </div>
        <div class="stats_description">Explain items here</div>

        <!-- abilities -->
        <div class="stats_description">Explain abilities here</div>

        <div class="stats_image" id="abilities_images">
            <div id="abilities_images2">
                <div class="ability_tag_outer">
                    <div class="ability_tag_inner">Intimidate</div>
                </div>
                <div class="ability_tag_outer">
                    <div class="ability_tag_inner">Zen Mode</div>
                </div>
                <div class="ability_tag_outer">
                    <div class="ability_tag_inner">Speed Boost</div>
                </div>
            </div>
            <img src="pokemon_pngs/incineroar.png" id="incineroar">
            <img src="pokemon_pngs/darmanitan.png" id="darmanitan">
            <img src="pokemon_pngs/sharpedo.png" id="sharpedo">
            <img src="pokemon_pngs/salamence.png" id="salamence">
            <img src="pokemon_pngs/darmanitan.png" id="darmanitan_galar">
            <img src="pokemon_pngs/yanmega.png" id="yanmega">

        </div>

        <!-- moves -->
        <div class="stats_image">Example moves</div>
        <div class="stats_description">Explain what moves are i guess</div>

        <!-- dynamax level -->
        <div id="dynamax_description">Explain gmax</div>
        <div class="stats_image">
            <img src="dynamax_pangoro.png" id="dynamax_pangoro">
        </div>

        <!-- tera type -->
        <div class="stats_image">
            <img src="tera_koraidon.png" id="tera_koraidon">
            <img src="tera_miraidon.png" id="tera_miraidon">
            <img src="tera_eevee.png" id="tera_eevee">

    <img src="porygon2.jpg" class="flying_pokemon" id="flying_rayquaza">
